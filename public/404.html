<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Skills — Lucas Gomes</title>
  <meta name="description" content="Hub de skills, automações e ferramentas para Claude IA. Encontre skills prontas para usar." />
  <meta property="og:title" content="Claude Skills — Lucas Gomes" />
  <meta property="og:description" content="Hub de skills, automações e ferramentas para Claude IA." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="profile">
      <div class="avatar">L</div>
      <h1 class="name">Lucas Gomes</h1>
      <p class="bio">Skills, automações e ferramentas para Claude IA. Acesse pelo link na bio do Instagram.</p>
      <div class="actions">
        <a href="https://instagram.com/gomeslucasf" target="_blank" rel="noopener" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          Instagram
        </a>
        <a href="https://github.com/gomeslucasf" target="_blank" rel="noopener" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.37.6.11.82-.26.82-.58v-2.03c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.72.08-.72 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.65.24 2.87.12 3.17.77.84 1.24 1.91 1.24 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.22.7.82.58C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"></path></svg>
          GitHub
        </a>
      </div>
    </section>

    <section class="search-section">
      <input
        type="text"
        id="search"
        class="search-input"
        placeholder="Buscar skill..."
        autocomplete="off"
      />
    </section>

    <section class="skills-section">
      <div id="loading" class="state">
        <div class="spinner"></div>
        <p>Carregando skills...</p>
      </div>
      <div id="empty" class="state hidden">
        <p>Nenhuma skill publicada ainda.</p>
        <span>Volte em breve ou procure no GitHub.</span>
      </div>
      <div id="error" class="state hidden">
        <p>Erro ao carregar skills.</p>
        <span id="error-message"></span>
      </div>
      <ul id="skills-list" class="skills-list"></ul>
    </section>

    <footer class="footer">
      <p>© <span id="year"></span> Lucas Gomes · Claude Skills Hub</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
