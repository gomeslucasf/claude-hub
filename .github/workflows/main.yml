name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Fallback de SPA: rotas internas (/skills, /mcps...) continuam funcionando
      # após refresh no GitHub Pages.
      - name: SPA fallback + .nojekyll
        run: |
          OUT=$(ls -d dist/client 2>/dev/null || ls -d dist)
          cp "$OUT/index.html" "$OUT/404.html" || true
          touch "$OUT/.nojekyll"
          echo "OUT_DIR=$OUT" >> $GITHUB_ENV

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
